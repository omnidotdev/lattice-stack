services:
  gateway:
    image: manifold.omni.dev/omnidotdev/lattice:latest
    environment:
      RUST_LOG: ${RUST_LOG:-info}
    volumes:
      - ./supergraph.graphql:/etc/lattice/supergraph.graphql:ro
    command: ["--config", "/etc/lattice/lattice.yaml"]
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:4000/health || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 5
    ports:
      - "${GATEWAY_PORT:-4000}:4000"
